plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'maven-publish'
}

apply plugin: 'net.fabricmc.fabric-loom'
apply plugin: 'maven-publish'

def mcVersion = stonecutter.current.version
def mcProp = { String key ->
	if (project.hasProperty(key) && project.property(key) != null) {
		return project.property(key).toString()
	}
	throw new GradleException("Missing property '${key}' for version ${mcVersion}")
}

def resolvedMcVersion = mcProp('minecraft_version')
def resolvedFabricApi = mcProp('fabric_api_version')

version = "${project.version}+${resolvedMcVersion}"
group = project.group

base {
	archivesName = "${rootProject.name}-${resolvedMcVersion}"
}

repositories {
	maven {
		name = "Maxhenkel"
		url = "https://maven.maxhenkel.de/repository/public"
	}
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "nerfed"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${resolvedMcVersion}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${resolvedFabricApi}"

	// Simple Voice Chat API: compile-only, so it's optional at runtime
	compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.findProperty('voicechat_api_version') ?: '2.5.0'}"

	// Mod Menu API: compile-only, not required at runtime
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def modVer = project.version.toString()
	def mcVer = resolvedMcVersion
	def mcCompat = mcProp('minecraft_compat')
	inputs.property "version", modVer
	inputs.property "minecraft_version", mcVer
	inputs.property "minecraft_compat", mcCompat

	filesMatching("fabric.mod.json") {
		expand(
				"version": modVer,
				"minecraft_version": mcVer,
				"minecraft_compat": mcCompat
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENCE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
